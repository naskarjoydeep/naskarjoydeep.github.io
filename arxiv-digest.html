<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arXiv Digest — Joydeep Naskar</title>
<meta name="description" content="Automated daily feed of new arXiv papers in holography, quantum information, and mathematical physics, matched against a topic list. No AI — each entry shows the paper's own abstract. AI audit coming soon.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --ink: #0f172a;
    --ink-soft: #475569;
    --heading: #075985;
    --link: #0369a1;
    --tag-bg: #e0f2fe;
    --shadow: 0 2px 8px rgba(0,0,0,0.05);
    --radius: 12px;
    --sans: system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --maxw: 860px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 20px 20px 80px; }
  header.page-head {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px 24px; margin: 20px 0;
  }
  .back-link { font-size: 0.85rem; color: var(--ink-soft); }
  h1.title { color: var(--heading); font-weight: 700; font-size: 2rem; margin: 10px 0 8px; }
  p.subtitle { color: var(--ink-soft); font-size: 0.98rem; max-width: 62ch; margin: 0 0 8px; }
  p.mechanism-note { color: var(--ink-soft); font-size: 0.88rem; max-width: 62ch; margin: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 20px; }
  #filter {
    flex: 1 1 260px; font-family: var(--sans); font-size: 0.92rem; padding: 10px 14px;
    border: 1px solid #cbd5e1; border-radius: 8px; background: var(--bg); color: var(--ink);
  }
  #filter::placeholder { color: var(--ink-soft); }
  .stamp { font-family: var(--mono); font-size: 0.78rem; color: var(--ink-soft); }
  .day-heading {
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--heading); margin: 32px 4px 12px;
  }
  .day-group:first-of-type .day-heading { margin-top: 24px; }
  article.paper-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 24px; margin-bottom: 16px; }
  .paper-card h3 { color: var(--heading); font-weight: 700; font-size: 1.15rem; margin: 0 0 8px; line-height: 1.4; }
  .paper-card h3 a { color: var(--heading); }
  .paper-card h3 a:hover { text-decoration: underline; }
  .meta-line { font-family: var(--mono); font-size: 0.76rem; color: var(--ink-soft); margin: 0 0 12px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .tag { font-family: var(--mono); font-size: 0.68rem; color: var(--link); background: var(--tag-bg); padding: 3px 9px; border-radius: 20px; }
  .summary { font-size: 0.96rem; margin: 0; }
  .empty-state { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 40px 28px; text-align: center; color: var(--ink-soft); font-size: 0.95rem; }
  .empty-state strong { color: var(--ink); }
  footer.page-foot { margin-top: 40px; font-family: var(--mono); font-size: 0.74rem; color: var(--ink-soft); text-align: center; }
  footer.page-foot a { color: var(--ink-soft); text-decoration: underline; }
  @media (prefers-reduced-motion: no-preference) {
    article.paper-card { transition: box-shadow 0.15s ease; }
    article.paper-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.09); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <a class="back-link" href="./">&larr; naskarjoydeep.github.io</a>
    <h1 class="title">arXiv Digest</h1>
    <p class="subtitle">New arXiv papers in holography, quantum information, and mathematical physics, matched daily against a topic list — shown with each paper's own abstract.</p>
    <p class="mechanism-note">AI audits coming soon.</p>
    <div class="toolbar">
      <input type="text" id="filter" placeholder="Filter by title, category, or topic…" autocomplete="off">
      <span class="stamp">Last updated: <span id="last-updated">—</span></span>
    </div>
  </header>

  <main id="digest-root"></main>

  <footer class="page-foot">
    <span id="count-line"></span> · Source on <a href="https://github.com/naskarjoydeep/naskarjoydeep.github.io" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>

<script type="application/json" id="digest-data">
[
  {
    "id": "2608.13300v1",
    "title": "3d $\\mathcal{N}=$ 4 rank-0 SCFT from punctured lens space",
    "authors": [
      "Sungjoon Kim"
    ],
    "categories": [
      "hep-th"
    ],
    "published": "2026-08-13",
    "link": "https://arxiv.org/abs/2608.13300v1",
    "summary": "{\\it Gang-Kim-Stubbs} theory $\\mathcal{T}_n$ --- a pioneering 3d bulk description of $M(2n+3,2)$ Virasoro minimal model as $\\mathcal{N}=4$ rank-0 superconformal field theory upon topological A-twist --- is derived from the compactification of a pair of parallel M5-branes on {\\it lens space} $L(2n+3,2)$ with a single vertex removed. From this perspective, we propose a family of 3d $\\mathcal{N}=2$ abelian gauge theories arising from the punctured $L(2n+3,1)$ lens space whose infrared phases realize the unitary member in the Galois orbit of $M(2n+3,2)$ modular tensor category. We also conjecture self-mirror rank-0 fixed points from amphichirality condition of the lens space.",
    "matched_terms": [
      "conformal field theory"
    ]
  },
  {
    "id": "2608.13543v1",
    "title": "Clifford Circuit Synthesis for Distributed Quantum Architectures with Arbitrary Network Topology",
    "authors": [
      "Tuomas Laakkonen"
    ],
    "categories": [
      "quant-ph"
    ],
    "published": "2026-08-13",
    "link": "https://arxiv.org/abs/2608.13543v1",
    "summary": "To achieve large-scale fault-tolerant quantum computation, it may be easier to combine many small sets of qubits than to construct a single large set. For example via quantum error correction with block codes, or distributed quantum processors utilizing shared entanglement. In these regimes, the time or error budget of the overall quantum computation may be dominated by non-local operations. Hence, it is worthwhile to minimize the number of these operations. We consider the case where both non-local and local connectivity may be arbitrarily restricted, and give an asymptotically optimal synthesis method for distributed CNOT and Clifford circuits, based on block-matrix Gaussian elimination. We extend this to all Clifford+RZ circuits by generalizing the Pauli exponential circuit representation; this naturally integrates with existing methods for optimizing T-count. As an application, we show how to implement CNOT circuits in a CSS code encoding n logical qubits in k blocks using O(nk) inter-block transversal CNOTs and intra-block Pauli measurements.",
    "matched_terms": [
      "quantum error correction"
    ]
  },
  {
    "id": "2608.13338v1",
    "title": "Robust Genuine Multipartite Entanglement in Two Walker Quantum Walks",
    "authors": [
      "Sandipan Hazra",
      "Tamoghna Das",
      "Sougato Bose",
      "Sonjoy Majumder"
    ],
    "categories": [
      "quant-ph"
    ],
    "published": "2026-08-13",
    "link": "https://arxiv.org/abs/2608.13338v1",
    "summary": "Discrete-time quantum walks provide a versatile framework for investigating the generation, redistribution, and transport of quantum correlations in composite quantum systems. Here, we study the dynamics of bipartite and genuine multipartite entanglement in a two-walker discrete-time quantum walk on a one-dimensional lattice. By employing logarithmic negativity and the generalized geometric measure (GGM), we systematically characterize the redistribution of bipartite entanglement among different subsystem partitions and the emergence of genuine multipartite entanglement involving the two coin and two position degrees of freedom. We show that the entanglement dynamics are strongly influenced by the lattice topology. The open-boundary regime exhibits a monotonic redistribution of quantum correlations, whereas the closed-boundary regime gives rise to pronounced oscillatory behavior due to boundary-induced interference and recurrent wave-packet overlap. In the open-boundary regime, the GGM rapidly approaches its theoretical maximum value of $1/2$ and remains largely insensitive to the choice of the initial Bell state as well as to continuous variations of the local coin operator over a broad parameter range, except near the Pauli-$X$ coin. These results demonstrate that maximal genuine multipartite entanglement generation is a robust and generic feature of open-boundary two-walker discrete-time quantum walks, establishing them as promising platforms for engineering multipartite quantum correlations in quantum information processing and quantum simulation.",
    "matched_terms": [
      "multipartite entanglement"
    ]
  },
  {
    "id": "2608.13181v1",
    "title": "Mid-circuit ground-state cooling and ancilla readout in the $\\textit{omg}$ architecture",
    "authors": [
      "Sean Brudney",
      "Connor Burns",
      "Gabriel J. Gregory",
      "Evan Ritchie",
      "David J. Wineland",
      "David T. C. Allcock",
      "Jameson O'Reilly"
    ],
    "categories": [
      "quant-ph"
    ],
    "published": "2026-08-13",
    "link": "https://arxiv.org/abs/2608.13181v1",
    "summary": "The trapped-ion optical-metastable-ground ($\\textit{omg}$) architecture for quantum processors promises the full functionality of two-species experiments, including sympathetic cooling and non-destructive ancilla readout, without the corresponding hardware overhead. We confirm that we can cool a global motional mode of a mixed metastable-ground state Coulomb crystal to the motional ground state via dissipative operations on the ground ($\\textit{g}$) qubit without disturbing coherence of the metastable ($\\textit{m}$) qubit. This enables quantum logic spectroscopy to non-destructively readout the state of the $\\textit{m}$ qubit using fluorescence detection of the $\\textit{g}$ qubit. Extensions of these demonstrations to larger system sizes should enable the mitigation of motional heating after ion shuttling and syndrome extraction for quantum error correction, both crucial primitives for future fault-tolerant quantum computers based on trapped ions.",
    "matched_terms": [
      "quantum error correction"
    ]
  },
  {
    "id": "2608.13238v1",
    "title": "Emergent Symmetry-Protected Topological Phases via Polyakov Confinement in Quantum Spin Systems",
    "authors": [
      "Li-Wei He",
      "Shun-Li Yu",
      "Jian-Xin Li"
    ],
    "categories": [
      "cond-mat.str-el"
    ],
    "published": "2026-08-13",
    "link": "https://arxiv.org/abs/2608.13238v1",
    "summary": "A main theme in modern condensed matter physics is the emergence of fractionalized excitations and gauge structures from quantum spin systems. However, understanding how these exotic degrees of freedom reconfine into new phases of matter remains a fundamental challenge. In this work, we demonstrate that Polyakov's confinement mechanism-a foundation of compact gauge theory-can serve as a dynamical engine to transform a Dirac spin liquid into a symmetry-protected topological (SPT) state. Starting with a Dirac spin liquid with spin-dependent gauge fluxes, we show that the single-occupancy constraint inherent to the physical Hilbert space triggers monopole condensation, dynamically confining bulk spinons while preserving gapless edge modes-realizing a spinon analog of the quantum spin Hall effect. Using a large-scale variational Monte Carlo simulation on a triangular antiferromagnet with an additional Dzyaloshinskii-Moriya interaction, we provide microscopic evidence for this confined SPT phase, including a characteristic area law for the Wilson loop and vanishing topological entanglement entropy. Furthermore, we identify a measurable spin-pump response under magnetic fields, which directly encodes the Berry curvature of the parent Dirac cones. Our results reveal a previously unexplored pathway to SPT physics, bridging the fields of gauge theory, quantum magnetism, and topological matter.",
    "matched_terms": [
      "entanglement entropy",
      "topological entanglement entropy"
    ]
  }
]
</script>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body, {delimiters: [
    {left: '$$', right: '$$', display: true},
    {left: '$', right: '$', display: false},
    {left: '\\(', right: '\\)', display: false},
    {left: '\\[', right: '\\]', display: true}
  ], throwOnError: false});"></script>

<script>
(function () {
  var dataEl = document.getElementById('digest-data');
  var entries = [];
  try { entries = JSON.parse(dataEl.textContent); } catch (e) { entries = []; }

  var root = document.getElementById('digest-root');
  var lastUpdatedEl = document.getElementById('last-updated');
  var countEl = document.getElementById('count-line');
  var filterInput = document.getElementById('filter');

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function groupByDate(list) {
    var map = {};
    var order = [];
    list.forEach(function (e) {
      var d = e.published || 'undated';
      if (!map[d]) { map[d] = []; order.push(d); }
      map[d].push(e);
    });
    order.sort();
    order.reverse();
    return order.map(function (d) { return [d, map[d]]; });
  }

  function paperCard(e) {
    var tags = (e.matched_terms || []).slice(0, 6)
      .map(function (t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('');
    return '' +
      '<article class="paper-card">' +
        '<h3><a href="' + escapeHtml(e.link || '#') + '" target="_blank" rel="noopener">' + escapeHtml(e.title) + '</a></h3>' +
        '<p class="meta-line">' + escapeHtml((e.authors || []).join(', ')) + ' &middot; ' +
          escapeHtml((e.categories || []).join(', ')) + ' &middot; <a href="' + escapeHtml(e.link || '#') + '" target="_blank" rel="noopener">' + escapeHtml(e.id || '') + '</a></p>' +
        (tags ? '<div class="tags">' + tags + '</div>' : '') +
        '<p class="summary">' + escapeHtml(e.summary) + '</p>' +
      '</article>';
  }

  function render(list) {
    if (!list.length) {
      root.innerHTML = '<div class="empty-state"><strong>No entries yet.</strong><br>The digest runs daily and will populate this page automatically. You can also trigger it by hand from the repo\'s Actions tab.</div>';
      countEl.textContent = '';
      return;
    }
    var groups = groupByDate(list);
    root.innerHTML = groups.map(function (pair) {
      return '<section class="day-group"><h2 class="day-heading">' + escapeHtml(pair[0]) + '</h2>' +
        pair[1].map(paperCard).join('') + '</section>';
    }).join('');
    countEl.textContent = list.length + (list.length === 1 ? ' entry' : ' entries') + ' on file';
    if (window.renderMathInElement) {
      renderMathInElement(root, {delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ], throwOnError: false});
    }
  }

  var realEntries = entries.filter(function (e) { return e.id !== 'example'; });
  var showList = realEntries.length ? realEntries : entries;

  if (realEntries.length) {
    var dates = realEntries.map(function (e) { return e.published; }).filter(Boolean).sort();
    lastUpdatedEl.textContent = dates.length ? dates[dates.length - 1] : '—';
  } else {
    lastUpdatedEl.textContent = 'not yet run';
  }

  filterInput.addEventListener('input', function () {
    var q = filterInput.value.trim().toLowerCase();
    if (!q) { render(showList); return; }
    var filtered = showList.filter(function (e) {
      var hay = [e.title, e.summary, (e.categories || []).join(' '), (e.matched_terms || []).join(' '), (e.authors || []).join(' ')]
        .join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    render(filtered);
  });

  render(showList);
})();
</script>
</body>
</html>
