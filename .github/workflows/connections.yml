name: Research web connections

on:
  # Right after the weekly INSPIRE sync, so new papers are already in publications.html.
  workflow_run:
    workflows: ["Publications"]
    types: [completed]
  workflow_dispatch:      # run by hand from the Actions tab
    inputs:
      paper:
        description: "Dry run: arXiv ID of a paper to classify as if it were new (leave empty for a normal run)"
        required: false
        default: ""

permissions:
  contents: write         # push the proposal branch
  pull-requests: write    # open the review pull request
  issues: write           # fall back to an issue if Actions may not open pull requests here
  models: read            # free GitHub Models inference with the built-in GITHUB_TOKEN

jobs:
  propose-connections:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Propose connections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PAPER: ${{ github.event.inputs.paper }}
        run: python scripts/classify_connections.py

      - name: Share the proposal for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "${{ github.event.inputs.paper }}" ]; then
            cat connections-report.md >> "$GITHUB_STEP_SUMMARY"   # dry run: show, don't commit
            exit 0
          fi
          git config user.name "connections-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ ! -f connections-report.md ]; then
            # Nothing new to review; only the remembered arXiv versions may have changed.
            git add research-web.html
            git diff --quiet --cached || { git commit -m "Record arXiv versions for the research web"; git push; }
            exit 0
          fi
          cat connections-report.md >> "$GITHUB_STEP_SUMMARY"

          # One branch, rebuilt from main each week, so proposals never pile up.
          branch="connections/proposal"
          title="Research web: proposed connections"
          git checkout -B "$branch"
          git add research-web.html
          git commit -m "Propose research-web connections ($(date -u +%Y-%m-%d))"
          git push -f origin "$branch"

          # 1. A pull request, if this repository lets Actions open one.
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file connections-report.md
            exit 0
          fi
          if gh pr create --base main --head "$branch" --title "$title" --body-file connections-report.md; then
            exit 0
          fi

          # 2. Otherwise an issue, with a one-click link to open the pull request by hand.
          {
            echo "GitHub Actions is not allowed to open pull requests in this repository, so the proposal is posted here."
            echo ""
            echo "**Review the changes and open the pull request:** https://github.com/$REPO/compare/main...$branch?expand=1"
            echo ""
            echo "To let the bot open pull requests itself, tick *Settings → Actions → General → Workflow permissions →"
            echo "Allow GitHub Actions to create and approve pull requests*."
            echo ""
            cat connections-report.md
          } > issue-body.md
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file issue-body.md
            gh issue comment "$issue" --body "Updated with the proposal of $(date -u +%Y-%m-%d)."
          else
            gh issue create --title "$title" --body-file issue-body.md
          fi
